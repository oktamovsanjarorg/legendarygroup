# Legendary Group — staging qatlami (T-011, 06 §1–2): prod bilan bir xil servislar + Postgres
# konteynerda (prod'da — RDS). Har doim `compose.prod.yml` ustiga qo'llanadi:
#
#   docker compose --env-file /etc/lg/staging.env -f compose.prod.yml -f compose.staging.yml up -d
#
# Staging'da: NODE_ENV=staging, alohida bot tokeni, alohida S3 bucket (06 §1).
name: lg-staging

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      # Ilova login'i (DDL huquqisiz) — birinchi ishga tushishda yaratiladi.
      APP_DB_LOGIN: ${APP_DB_LOGIN:?}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-app-login.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources: { limits: { memory: 512M, cpus: '1.0' } }

  migrate:
    depends_on:
      postgres: { condition: service_healthy }

  # t4g.small (2 GB) uchun kichikroq limitlar.
  api:
    deploy:
      resources: { limits: { memory: 384M, cpus: '1.0' } }
  worker:
    deploy:
      resources: { limits: { memory: 384M, cpus: '1.0' } }

volumes:
  postgres_data:
