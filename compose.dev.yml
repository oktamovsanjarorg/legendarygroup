name: legendarygroup-dev

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: lg_dev_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-legendary_dev}
      TZ: UTC
    ports:
      - '${POSTGRES_PORT:-5434}:5432'
    volumes:
      # PG 18 image: ma'lumot /var/lib/postgresql/18/docker da (major yangilashga tayyor)
      - postgres_dev_data:/var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-legendary_dev}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: lg_dev_redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    # MinIO 2025-09 dan beri community image chiqarmaydi - oxirgi rasmiy relizga qotirilgan.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: lg_dev_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_dev_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: lg_dev_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/$${S3_BUCKET_FILES:-lg-local-files};
      exit 0;
      "
    restart: 'no'

volumes:
  postgres_dev_data:
    name: lg_dev_postgres18_data
  redis_dev_data:
    name: lg_dev_redis_data
  minio_dev_data:
    name: lg_dev_minio_data
