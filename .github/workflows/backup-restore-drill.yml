name: Backup & Restore Drill (T-015)

on:
  schedule:
    # Har oyning 1-kunida 04:00 UTC
    - cron: '0 4 1 * *'
  workflow_dispatch:

concurrency:
  group: backup-restore-drill
  cancel-in-progress: true

jobs:
  drill:
    name: Monthly Backup Restore Drill
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: legendary_drill_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Migrations on Source Database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/legendary_drill_source
        run: pnpm --filter @lg/db migrate

      - name: Seed Database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/legendary_drill_source
        run: pnpm --filter @lg/db seed

      - name: Execute Backup & Restore Drill
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: legendary_drill_source
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          chmod +x scripts/backup.sh scripts/restore.sh scripts/backup-restore-drill.sh
          ./scripts/backup-restore-drill.sh
