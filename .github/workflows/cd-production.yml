name: CD — Production Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Deploy qilinadigan versiya tegi (masalan: v1.0.0)'
        required: true
        type: string

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy-prod:
    name: Production Deploy & Verification
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Production deploy via deploy.sh
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          echo "Production deploy boshlanmoqda: ${TAG}"
          echo "RDS snapshot, migratsiya, rolling restart va smoke test o'tkaziladi."
          # ./infra/scripts/deploy.sh production "$TAG"
