name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-unit:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Sxema (TS) va migratsiyalar mosligi: snapshot eskirsa yoki migratsiya unutilsa — qizil.
      - name: DB schema drift
        run: |
          pnpm --filter @lg/db exec drizzle-kit generate --name ci_drift_probe
          if [ -n "$(git status --porcelain packages/db/drizzle)" ]; then
            git status --porcelain packages/db/drizzle
            echo "::error::TS sxemada migratsiyasiz o'zgarish bor — pnpm --filter @lg/db db:generate"
            exit 1
          fi

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: legendary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Integration Tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/legendary_test
          REDIS_URL: redis://localhost:6379
        # Qolgan env — testlarning o'zida (apps/api/src/test/env.ts); turbo faqat shu ikkisini o'tkazadi.
        run: pnpm test:int

  docker-build:
    name: Docker Build Check (arm64)
    # Prod server — Graviton: image'lar prod bilan bir xil platformada, native runner'da (QEMU yo'q).
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # `docker buildx build --cache-to type=gha` uchun ACTIONS_RUNTIME_TOKEN/cache URL kerak.
      - name: GHA kesh muhiti
        uses: crazy-max/ghaction-github-runtime@v3

      # Bitta Dockerfile, 4 target (infra/docker/Dockerfile). Kesh — prod deploy bilan umumiy.
      - name: Build api, worker, bot, web
        run: |
          for t in api worker bot web; do
            echo "::group::$t"
            docker buildx build --platform linux/arm64 -f infra/docker/Dockerfile --target "$t" \
              --cache-from type=gha,scope=prod-arm64 --cache-to type=gha,scope=prod-arm64,mode=max \
              -t "lg-$t:ci" .
            echo "::endgroup::"
          done
